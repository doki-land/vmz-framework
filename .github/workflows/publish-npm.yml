# Trusted Publisher contract (sole npm trusted workflow — keep this filename):
#   file = publish-npm.yml
#   repo = doki-land/vmz-framework
#   env  = NPM_PUBLISH
#
# Triggers:
#   - push tag v*           (e.g. v0.1.14) — preferred
#   - workflow_dispatch     (retry only): version MUST match an existing tag;
#     jobs checkout that tag peel — never publish branch HEAD with a free version
#     (0.1.13 incident: dispatch from dev@aaced24a published 0.1.13 while tag
#     v0.1.13 → 1c36aa2 and tag-push publish failed).
# Do not register Trusted Publisher on any other workflow file.

name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Must match existing git tag vX.Y.Z (retry only; checkout forced to that tag)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  provenance:
    name: Bind version ↔ tag ↔ commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bind.outputs.version }}
      sha: ${{ steps.bind.outputs.sha }}
      tag: ${{ steps.bind.outputs.tag }}
    steps:
      - name: Checkout (for tag fetch)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bind publish tag
        id: bind
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/bind-publish-tag.mjs

      - name: Require green CI on tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.bind.outputs.sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --repo "${{ github.repository }}" --commit "${TAG_SHA}" --workflow ci.yml --json conclusion -q '.[0].conclusion // empty')"
          if [[ "$conclusion" != "success" ]]; then
            echo "Refusing npm publish: CI on ${TAG_SHA} is '${conclusion:-missing}' (need success)" >&2
            exit 1
          fi
          echo "CI success confirmed for ${TAG_SHA}"

  build-native:
    name: Native ${{ matrix.short }}
    needs: provenance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            short: win32-x64
            triple: win32-x64-msvc
          - os: ubuntu-latest
            short: linux-x64
            triple: linux-x64-gnu
          - os: macos-latest
            short: darwin-arm64
            triple: darwin-arm64
    steps:
      - name: Checkout tag peel
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.provenance.outputs.tag }}
          fetch-depth: 0

      - name: Verify HEAD is bound tag SHA
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="${{ needs.provenance.outputs.sha }}"
          if [[ "$head" != "$want" ]]; then
            echo "Refusing native build: HEAD=$head != bound tag sha=$want" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-native-${{ matrix.short }}
          cache-on-failure: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build native (release)
        run: node scripts/build/napi.mjs --release

      - name: Stage native artifact
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.short }}"
          mkdir -p "$out"
          src="packages/runtimes/vmz-${{ matrix.short }}"
          # One platform-named binary only (vmz.<triple>.node) - no plain vmz.node twin.
          named="vmz.${{ matrix.triple }}.node"
          if [[ -f "$src/$named" ]]; then
            cp "$src/$named" "$out/$named"
          elif [[ -f "$src/vmz.node" ]]; then
            # legacy local build: rename into platform name for the artifact
            cp "$src/vmz.node" "$out/$named"
          else
            echo "missing native binary under $src (want $named)" >&2
            ls -la "$src" || true
            exit 1
          fi
          ls -la "$out"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.short }}
          path: dist/${{ matrix.short }}
          if-no-files-found: error

  publish:
    name: Publish packages
    needs: [provenance, build-native]
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    steps:
      - name: Checkout tag peel
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.provenance.outputs.tag }}
          fetch-depth: 0

      - name: Verify HEAD is bound tag SHA
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="${{ needs.provenance.outputs.sha }}"
          if [[ "$head" != "$want" ]]; then
            echo "Refusing publish: HEAD=$head != bound tag sha=$want" >&2
            exit 1
          fi
          echo "publishing ${{ needs.provenance.outputs.tag }} @ $head"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Do NOT set registry-url: it writes _authToken=${NODE_AUTH_TOKEN} into
          # the runner npmrc and blocks Trusted Publisher OIDC (npm E404 on PUT).
          # Lockfile is gitignored; setup-node@v5 auto-cache requires pnpm-lock.yaml.
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/native-artifacts

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native-flat
          for d in dist/native-artifacts/native-* dist/native-artifacts/*; do
            [[ -d "$d" ]] || continue
            base="$(basename "$d")"
            short="${base#native-}"
            mkdir -p "dist/native-flat/$short"
            cp -r "$d"/. "dist/native-flat/$short/" || true
          done
          find dist/native-flat -type f -print
          # Fail early if a matrix platform is missing.
          for short in win32-x64 linux-x64 darwin-arm64; do
            if ! find "dist/native-flat/$short" -name 'vmz.*.node' -type f | grep -q .; then
              echo "missing native binary for $short under dist/native-flat" >&2
              exit 1
            fi
          done

      - name: Build JS runtimes only (natives from matrix artifacts)
        run: pnpm build:runtimes:js

      - name: Assert @vmz/vmz dist pack contract
        run: node scripts/ci/assert-vmz-pack.mjs

      - name: Strip token-style npmrc (OIDC only)
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in "${HOME}/.npmrc" "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc"; do
            [[ -n "${f}" && -f "${f}" ]] || continue
            if grep -q '_authToken' "${f}"; then
              grep -v '_authToken' "${f}" > "${f}.oidc" && mv "${f}.oidc" "${f}"
              echo "stripped _authToken from ${f}"
            fi
          done

      - name: Publish real packages
        env:
          VMZ_NATIVE_ARTIFACTS: ${{ github.workspace }}/dist/native-flat
          GITHUB_REF: refs/tags/v${{ needs.provenance.outputs.version }}
        run: node scripts/ci/publish-npm.mjs --version=${{ needs.provenance.outputs.version }}
