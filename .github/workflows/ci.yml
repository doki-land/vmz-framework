name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# One JS runtime build, then parallel required gates (no continue-on-error on gates):
#   build-runtimes — JS runtime dist artifact (native `.node` skipped; Trusted
#                    Publisher matrix in `publish-npm.yml` builds native artifacts)
#   fmt            — `pnpm fmt:check` after artifact restore
#   build-test     — unit + examples
#   ui-browser     — ui-automation + browser-production (Chrome)
#   runtime-gates  — Slim + runtime-quality-baseline
# Downstream jobs set VMZ_SKIP_NATIVE_BUILD=1 so verify `pre: build:runtimes` is a no-op.
# After artifact restore, each consumer runs `pnpm verify -- skip-native-pre` first.

jobs:
  build-runtimes:
    name: Build Runtimes
    runs-on: ubuntu-latest
    # Native `.node` artifacts are built by the Trusted Publisher matrix in
    # `.github/workflows/publish-npm.yml`; the CI main chain only needs the
    # JS runtime dist for downstream jobs (fmt, unit, ui automation).
    env:
      VMZ_SKIP_NAPI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release gate fixtures
        run: node --test scripts/ci/require-ci-success.test.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build runtimes (JS only; native built by Trusted Publisher)
        run: pnpm build:runtimes

      - name: Assert @vmz/vmz dist pack contract
        run: node scripts/ci/assert-vmz-pack.mjs

      - name: Pack runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          # `.node` is optional here — CI skips napi; Trusted Publisher supplies
          # native artifacts later. Tolerate absence so downstream JS gates still run.
          native_arg=""
          if compgen -G "packages/runtimes/vmz-linux-x64/vmz.*.node" > /dev/null; then
            native="$(ls packages/runtimes/vmz-linux-x64/vmz.*.node | head -n1)"
            test -f "$native"
            native_arg="$native"
          fi
          tar_args=(
            packages/runtimes/vmz/dist
            packages/runtimes/vmz-runtime/dist
            packages/runtimes/vmz-protocol/dist
            packages/runtimes/vmz-commander/dist
            packages/runtimes/vmz-diagnostic/dist
            packages/runtimes/vmz-fixtures/dist
            packages/runtimes/vmz-test/dist
            packages/plugins/vmz-plugin-shiki/dist
            packages/plugins/vmz-plugin-markdown-it/dist
            packages/plugins/vmz-plugin-katex/dist
            packages/ui/vmz-ui-icons/dist
            packages/runtimes/vmz-linux-x64/package.json
          )
          if [ -n "$native_arg" ]; then tar_args+=("$native_arg"); fi
          tar -czf runtime-build.tar.gz "${tar_args[@]}"
          ls -lh runtime-build.tar.gz

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build
          path: runtime-build.tar.gz
          if-no-files-found: error
          retention-days: 2

  fmt:
    name: Format Check
    needs: [build-runtimes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          # `.node` is optional in CI main chain (native built by Trusted Publisher)
          compgen -G "packages/runtimes/vmz-linux-x64/vmz.*.node" > /dev/null && \
            ls packages/runtimes/vmz-linux-x64/vmz.*.node || echo "(no native .node in CI artifact — ok)"

      - name: Check format (`vmz format --check` via `vmz.config` `format`; same as `pnpm fmt:check`)
        run: pnpm fmt:check

  build-test:
    name: Build and Test
    needs: [build-runtimes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          test -f packages/runtimes/vmz-runtime/dist/faces/server.js
          test -f packages/plugins/vmz-plugin-markdown-it/dist/vmz.plugin.js
          test -f packages/plugins/vmz-plugin-katex/dist/vmz.plugin.js
          compgen -G "packages/runtimes/vmz-linux-x64/vmz.*.node" > /dev/null && \
            ls packages/runtimes/vmz-linux-x64/vmz.*.node || echo "(no native .node in CI artifact — ok)"

      - name: Assert skip-native-pre contract
        run: pnpm verify:ci-skip-native-pre

      - name: Build tools + examples
        shell: bash
        run: |
          set -euo pipefail
          echo "Example build steps are intentionally isolated below."

      - name: Build example hello
        run: pnpm --filter @vmz-examples/hello run build

      - name: Build example counter
        run: pnpm --filter @vmz-examples/counter run build

      - name: Build example event-shell
        run: pnpm --filter @vmz-examples/event-shell run build

      - name: Build example fullstack
        run: pnpm --filter @vmz-examples/fullstack run build

      - name: Build example island
        run: pnpm --filter @vmz-examples/island run build

      - name: Build example production-catalog
        run: pnpm --filter @vmz-examples/production-catalog run build

      - name: Build example production-inspector
        run: pnpm --filter @vmz-examples/production-inspector run build

      - name: Build example production-router
        run: pnpm --filter @vmz-examples/production-router run build

      - name: Build example vmz-style-tailwind
        run: pnpm --filter @vmz-examples/vmz-style-tailwind run build

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Unit tests (textmate / shared packages)
        run: pnpm test:unit:only

      - name: VMZ formatter contract
        run: cargo test -p vmz-formatter --test format_contract

      - name: Verify Chromium
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Example counter (no browser)
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=compile,logic,ssr,resume,deployment"

      - name: Puppeteer Chromium smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: |
          set -eu
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          pnpm --filter @vmz/test exec -- node ./scripts/chrome-smoke.mjs

      - name: Example counter (browser)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=browser"

      - name: Example island
        run: pnpm --filter @vmz-examples/island run test

      - name: Example fullstack
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm --filter @vmz-examples/fullstack run test

  ui-browser:
    name: UI and Browser Production
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          compgen -G "packages/runtimes/vmz-linux-x64/vmz.*.node" > /dev/null && \
            ls packages/runtimes/vmz-linux-x64/vmz.*.node || echo "(no native .node in CI artifact — ok)"

      - name: Assert skip-native-pre contract
        run: pnpm verify:ci-skip-native-pre

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: UI automation + browser-production (keep-going)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm verify:ci-ui-browser

  runtime-gates:
    name: Slim and Runtime Quality
    needs: [ui-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          compgen -G "packages/runtimes/vmz-linux-x64/vmz.*.node" > /dev/null && \
            ls packages/runtimes/vmz-linux-x64/vmz.*.node || echo "(no native .node in CI artifact — ok)"

      - name: Assert skip-native-pre contract
        run: pnpm verify:ci-skip-native-pre

      - name: Slim + runtime-quality-baseline (keep-going)
        run: pnpm verify:ci-runtime-gates
