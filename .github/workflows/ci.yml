name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Lockfile is gitignored; setup-node@v5 auto-cache requires pnpm-lock.yaml.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Check format (Biome; same as `pnpm fmt:check`)
        run: pnpm fmt:check

  # One runner: build runtimes once, then examples + tests (no second cargo/JS rebuild).
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-test
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install

      - name: Build runtimes (native + JS)
        run: pnpm build:runtimes

      - name: Assert @vmz/vmz dist pack contract
        run: node scripts/ci/assert-vmz-pack.mjs

      - name: Build tools + examples
        run: pnpm build:examples

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Unit tests (textmate / shared packages)
        run: pnpm test:unit:only

      - name: Verify Chromium
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Example counter (no browser)
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=compile,logic,ssr,resume,deployment"

      - name: Puppeteer Chromium smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: |
          set -eu
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          pnpm --filter @vmz/test exec -- node ./scripts/chrome-smoke.mjs

      - name: Example counter (browser)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=browser"

      - name: Example island
        run: pnpm --filter @vmz-examples/island run test

      - name: Example fullstack
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm --filter @vmz-examples/fullstack run test

      - name: UI automation (Chrome)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm verify -- ui-automation
