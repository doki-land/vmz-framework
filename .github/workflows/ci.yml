name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# One Rust/native build produces the runtime artifact. Every gate below depends only
# on that artifact and never on another gate's conclusion, so one failure cannot hide
# unrelated failures: format, Rust pack tests, unit/example tests, browser production
# and runtime gates all report in the same run instead of queueing behind each other.
# The only unavoidable dependency is compilation, since the gates execute the release
# native built here.
#   build-native   — release cargo/napi + JS runtime dist artifact (compile + pack only)
#   lint           — `pnpm lint` (`nifty check`); no `needs`, so it reports even when the build is red
#   fmt            — `pnpm fmt:check` after artifact restore
#   build-runtimes — `vmz-pack` / `vmz-napi` cargo tests + dist pack asserts
#   build-test     — unit + examples + browser smoke
#   ui-browser     — ui-automation + direct host box + radio checkedness + chart hydration + v-memo + browser-production (Chrome)
#   runtime-gates  — Slim + runtime-quality-baseline + authoring/hydration gates + SSR delivery imports + dev pack input skip
# Downstream jobs set VMZ_SKIP_NATIVE_BUILD=1 so verify `pre: build:runtimes` is a no-op.
# After artifact restore, each consumer runs `pnpm verify -- skip-native-pre` first.

jobs:
  build-native:
    name: Build Native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release gate and publish preflight fixtures
        run: node --test scripts/ci/require-ci-success.test.mjs scripts/ci/preflight-publish.test.mjs scripts/ci/rust-toolchain.test.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      # 工具链 pin 只写在仓根 `rust-toolchain.toml`：工作流不得出现浮动 channel。
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(node scripts/ci/rust-toolchain.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Record and verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          rustup show active-toolchain | grep -F "$(node scripts/ci/rust-toolchain.mjs)"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-test
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install

      - name: Verify dependency resolution is pinned
        # CI has no sibling checkouts, so every dependency must come from a pinned
        # revision and the committed `Cargo.lock` must match it. `check:overlay`
        # runs `cargo metadata --locked` and rejects packages resolved from any
        # local path, which is the only symptom of a stray `[patch]` override.
        run: pnpm check:overlay -- --expect-no-overlay

      - name: Build runtimes (native + JS)
        # 门禁必须跑发布同款 native：`publish-npm.yml` 用 `--release` 构建 `.node`，
        # 而 `pack`（graph/link/emit）在 debug 下比 release 慢一个数量级，会把
        # ui-browser 的构建推到 30 分钟上限之外。native 先按发布口径构建，
        # 其余 JS dist 用 `VMZ_SKIP_NAPI=1` 跳过重复编译。
        run: |
          node scripts/build/napi.mjs --release
          VMZ_SKIP_NAPI=1 pnpm build:runtimes

      - name: Pack runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          native="$(ls packages/runtimes/vmz-linux-x64/vmz.*.node | head -n1)"
          test -n "$native"
          test -f "$native"
          tar -czf runtime-build.tar.gz \
            packages/runtimes/vmz/dist \
            packages/runtimes/vmz-runtime/dist \
            packages/runtimes/vmz-protocol/dist \
            packages/runtimes/vmz-commander/dist \
            packages/runtimes/vmz-diagnostic/dist \
            packages/runtimes/vmz-fixtures/dist \
            packages/runtimes/vmz-test/dist \
            packages/plugins/vmz-plugin-shiki/dist \
            packages/plugins/vmz-plugin-markdown-it/dist \
            packages/plugins/vmz-plugin-katex/dist \
            packages/ui/vmz-ui-icons/dist \
            packages/davinci/davinci/dist \
            packages/runtimes/vmz-linux-x64/package.json \
            "$native"
          ls -lh runtime-build.tar.gz

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build
          path: runtime-build.tar.gz
          if-no-files-found: error
          retention-days: 2

  lint:
    name: Lint
    # Deliberately no `needs`: `nifty check` reads manifests and git history only, so it costs
    # a minute and must report even when the native build is red.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Run lint (`nifty check`)
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint | tee "$RUNNER_TEMP/lint-report.txt"
          { echo '### `nifty check`'; echo '```'; tail -n 1 "$RUNNER_TEMP/lint-report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format Check
    needs: [build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      # 工具链 pin 只写在仓根 `rust-toolchain.toml`：工作流不得出现浮动 channel。
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(node scripts/ci/rust-toolchain.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt

      - name: Record and verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          rustup show active-toolchain | grep -F "$(node scripts/ci/rust-toolchain.mjs)"

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Check format (`vmz format --check --rust .` on the explicit repo root; same as `pnpm fmt:check`)
        run: pnpm fmt:check

  build-runtimes:
    name: Build Runtimes
    needs: [build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      # 工具链 pin 只写在仓根 `rust-toolchain.toml`：工作流不得出现浮动 channel。
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(node scripts/ci/rust-toolchain.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Record and verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          rustup show active-toolchain | grep -F "$(node scripts/ci/rust-toolchain.mjs)"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-test
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Test vmz-pack artifact gates
        run: cargo test -p vmz-pack -p vmz-napi

      - name: Assert @vmz/vmz dist pack contract
        run: node scripts/ci/assert-vmz-pack.mjs

      - name: Verify @doki-land/davinci facade pack
        run: node scripts/ci/verify-davinci-facade.mjs

      - name: Verify @vmz/ui-charts pack surface
        run: node scripts/ci/verify-ui-charts-pack.mjs

  build-test:
    name: Build and Test
    needs: [build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          test -f packages/runtimes/vmz-runtime/dist/faces/server.js
          test -f packages/plugins/vmz-plugin-markdown-it/dist/vmz.plugin.js
          test -f packages/plugins/vmz-plugin-katex/dist/vmz.plugin.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Assert skip-native-pre contract
        run: pnpm verify:ci-skip-native-pre

      - name: Build tools + examples
        shell: bash
        run: |
          set -euo pipefail
          echo "Example build steps are intentionally isolated below."

      - name: Build example hello
        run: pnpm --filter @vmz-examples/hello run build

      - name: Build example counter
        run: pnpm --filter @vmz-examples/counter run build

      - name: Build example event-shell
        run: pnpm --filter @vmz-examples/event-shell run build

      - name: Build example fullstack
        run: pnpm --filter @vmz-examples/fullstack run build

      - name: Build example island
        run: pnpm --filter @vmz-examples/island run build

      - name: Build example production-catalog
        run: pnpm --filter @vmz-examples/production-catalog run build

      - name: Build example production-inspector
        run: pnpm --filter @vmz-examples/production-inspector run build

      - name: Build example production-router
        run: pnpm --filter @vmz-examples/production-router run build

      - name: Build example vmz-style-tailwind
        run: pnpm --filter @vmz-examples/vmz-style-tailwind run build

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Unit tests (textmate / shared packages)
        run: pnpm test:unit:only

      - name: VMZ formatter contract
        run: cargo test -p vmz-formatter --test format_contract

      - name: Verify Chromium
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Example counter (no browser)
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=compile,logic,ssr,resume,deployment"

      - name: Puppeteer Chromium smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: |
          set -eu
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          pnpm --filter @vmz/test exec -- node ./scripts/chrome-smoke.mjs

      - name: Example counter (browser)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=browser"

      - name: Example island
        run: pnpm --filter @vmz-examples/island run test

      - name: Example fullstack
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm --filter @vmz-examples/fullstack run test

  ui-browser:
    name: UI and Browser Production
    needs: [build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Assert skip-native-pre contract
        run: pnpm verify:ci-skip-native-pre

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: UI automation + browser-production (keep-going)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm verify:ci-ui-browser

  runtime-gates:
    name: Slim and Runtime Quality
    needs: [build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Assert skip-native-pre contract
        run: pnpm verify:ci-skip-native-pre

      - name: Slim + runtime-quality-baseline (keep-going)
        run: pnpm verify:ci-runtime-gates
