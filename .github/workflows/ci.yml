name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# One Rust/native build, then parallel required gates (no continue-on-error on gates):
#   build-runtimes — sole cargo/napi + JS runtime dist artifact
#   build-test     — pack smoke already done upstream; unit + examples
#   ui-browser     — ui-automation + browser-production (Chrome)
#   runtime-gates  — Slim + runtime-quality-baseline
# Downstream jobs set VMZ_SKIP_NATIVE_BUILD=1 so verify `pre: build:runtimes` is a no-op.

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Check format (Biome; same as `pnpm fmt:check`)
        run: pnpm fmt:check

  build-runtimes:
    name: Build Runtimes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-test
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install

      - name: Build runtimes (native + JS)
        run: pnpm build:runtimes

      - name: Assert @vmz/vmz dist pack contract
        run: node scripts/ci/assert-vmz-pack.mjs

      - name: Pack runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          native="$(ls packages/runtimes/vmz-linux-x64/vmz.*.node | head -n1)"
          test -n "$native"
          test -f "$native"
          tar -czf runtime-build.tar.gz \
            packages/runtimes/vmz/dist \
            packages/runtimes/vmz-runtime/dist \
            packages/runtimes/vmz-protocol/dist \
            packages/runtimes/vmz-commander/dist \
            packages/runtimes/vmz-diagnostic/dist \
            packages/runtimes/vmz-fixtures/dist \
            packages/runtimes/vmz-test/dist \
            packages/plugins/vmz-plugin-shiki/dist \
            packages/runtimes/vmz-linux-x64/package.json \
            "$native"
          ls -lh runtime-build.tar.gz

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build
          path: runtime-build.tar.gz
          if-no-files-found: error
          retention-days: 2

  build-test:
    name: Build and Test
    needs: [build-runtimes]
    runs-on: ubuntu-latest
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          test -f packages/runtimes/vmz-runtime/dist/faces/server.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Build tools + examples
        run: pnpm build:examples

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Unit tests (textmate / shared packages)
        run: pnpm test:unit:only

      - name: Verify Chromium
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Example counter (no browser)
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=compile,logic,ssr,resume,deployment"

      - name: Puppeteer Chromium smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: |
          set -eu
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          pnpm --filter @vmz/test exec -- node ./scripts/chrome-smoke.mjs

      - name: Example counter (browser)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=browser"

      - name: Example island
        run: pnpm --filter @vmz-examples/island run test

      - name: Example fullstack
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm --filter @vmz-examples/fullstack run test

  ui-browser:
    name: UI and Browser Production
    needs: [build-runtimes]
    runs-on: ubuntu-latest
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: UI automation + browser-production (keep-going)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm verify -- --keep-going ui-automation browser-production

  runtime-gates:
    name: Slim and Runtime Quality
    needs: [build-runtimes]
    runs-on: ubuntu-latest
    env:
      VMZ_SKIP_NATIVE_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: runtime-build
          path: .

      - name: Restore runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf runtime-build.tar.gz
          test -f packages/runtimes/vmz/dist/cli/cli.js
          ls packages/runtimes/vmz-linux-x64/vmz.*.node

      - name: Slim + runtime-quality-baseline (keep-going)
        env:
          CI: 'true'
        run: >
          pnpm verify -- --keep-going
          runtime-boundary
          specialized-component-artifact
          compiled-delivery-artifact
          thin-runtime-host-boundary
          thin-runtime-production-proof
          runtime-quality-baseline
