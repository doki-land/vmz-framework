name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Lockfile is gitignored; setup-node@v5 auto-cache requires pnpm-lock.yaml.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Check TypeScript/JavaScript format
        run: pnpm exec biome format --diagnostic-level=error .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build runtimes (native + JS)
        run: pnpm build:runtimes

      - name: Build tools + examples
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build runtimes (native + JS)
        run: pnpm build:runtimes

      - name: Install Chromium (browser host / CDP)
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Unit tests (textmate / shared packages)
        run: pnpm test:unit

      - name: Verify Chromium
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Example counter (no browser)
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=compile,logic,ssr,resume,deployment"

      - name: Puppeteer Chromium smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: |
          set -eu
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          pnpm --filter @vmz/test exec -- node ./scripts/chrome-smoke.mjs

      - name: Example counter (browser)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
          VMZ_BROWSER_DEBUG: '1'
        run: pnpm --filter @vmz-examples/counter exec -- vmz test . "--mode=browser"

      - name: Example island
        run: pnpm --filter @vmz-examples/island run test

      - name: Example fullstack
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VMZ_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: 'true'
        run: pnpm --filter @vmz-examples/fullstack run test
