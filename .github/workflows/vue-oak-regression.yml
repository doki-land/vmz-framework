name: Vue Oak Directive Regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  vue-directive-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # 工具链 pin 只写在仓根 `rust-toolchain.toml`。
      # Windows runner 默认 pwsh，`$GITHUB_OUTPUT` 只在 bash 下是输出文件通道。
      - name: Resolve pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/ci/rust-toolchain.mjs)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Record and verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          rustup show active-toolchain | grep -F "$(node scripts/ci/rust-toolchain.mjs)"
      - uses: Swatinem/rust-cache@v2
      - name: Compile isolated regression
        run: cargo test -p vmz-oak-frontend-adapter --test vue_directive_regression --no-run --message-format=json > regression-build.json
      - name: Run isolated regression with resource bounds
        shell: bash
        run: |
          set -euo pipefail
          binary="$(python3 -c 'import json; print(next(item["executable"] for line in open("regression-build.json") if (item := json.loads(line)).get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "vue_directive_regression"))')"
          ulimit -v 524288
          timeout 30s "$binary" event_shell_directive_has_bounded_allocations_and_exact_spans --nocapture
