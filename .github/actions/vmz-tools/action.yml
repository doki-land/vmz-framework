name: VMZ Tools
description: >-
  Downstream template for the VMZ tool collection. First tool monitors GitHub
  Actions by spawning the product CLI (`vmz github-actions`), which calls Rust
  octocrab via N-API. No Octokit / gh CLI inside this Action.
  uses: doki-land/vmz-framework/.github/actions/vmz-tools@<ref>

inputs:
  tool:
    description: Tool id (github-actions)
    required: false
    default: github-actions
  mode:
    description: github-actions mode — status or wait
    required: false
    default: status
  workflow:
    description: Workflow file name (e.g. ci.yml) or numeric id
    required: false
    default: ''
  run-id:
    description: Specific workflow run id
    required: false
    default: ''
  ref:
    description: Commit SHA filter
    required: false
    default: ''
  branch:
    description: Branch name filter
    required: false
    default: ''
  timeout-minutes:
    description: Max wait minutes for mode=wait
    required: false
    default: '45'
  interval-seconds:
    description: Poll interval seconds for mode=wait
    required: false
    default: '15'
  required-conclusion:
    description: Required conclusion when mode=wait
    required: false
    default: success
  owner:
    description: Repository owner override
    required: false
    default: ''
  repo:
    description: Repository name override
    required: false
    default: ''
  token:
    description: GitHub token (default github.token)
    required: false
    default: ${{ github.token }}
  vmz-command:
    description: >-
      Product CLI invocation (downstream usually `pnpm exec vmz` with a locked
      published @vmz/vmz). Framework dogfood should point at workspace-latest bin.
    required: false
    default: pnpm exec vmz
  working-directory:
    description: Working directory for the CLI (project root with package.json)
    required: false
    default: '.'

outputs:
  run-id:
    description: Resolved workflow run id
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: Latest run status
    value: ${{ steps.run.outputs.status }}
  conclusion:
    description: Latest run conclusion
    value: ${{ steps.run.outputs.conclusion }}
  html-url:
    description: Workflow run HTML URL
    value: ${{ steps.run.outputs.html-url }}

runs:
  using: composite
  steps:
    - name: Run tool via product CLI
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        TOOL='${{ inputs.tool }}'
        if [ "${TOOL}" != "github-actions" ]; then
          echo "vmz-tools: unknown tool '${TOOL}' (known: github-actions)" >&2
          exit 1
        fi
        ARGS=(github-actions --mode '${{ inputs.mode }}' --json)
        WORKFLOW='${{ inputs.workflow }}'
        RUN_ID='${{ inputs.run-id }}'
        REF='${{ inputs.ref }}'
        BRANCH='${{ inputs.branch }}'
        OWNER='${{ inputs.owner }}'
        REPO='${{ inputs.repo }}'
        if [ -n "${WORKFLOW}" ]; then ARGS+=(--workflow "${WORKFLOW}"); fi
        if [ -n "${RUN_ID}" ]; then ARGS+=(--run-id "${RUN_ID}"); fi
        if [ -n "${REF}" ]; then ARGS+=(--ref "${REF}"); fi
        if [ -n "${BRANCH}" ]; then ARGS+=(--branch "${BRANCH}"); fi
        ARGS+=(--timeout-minutes '${{ inputs.timeout-minutes }}')
        ARGS+=(--interval-seconds '${{ inputs.interval-seconds }}')
        ARGS+=(--required-conclusion '${{ inputs.required-conclusion }}')
        if [ -n "${OWNER}" ]; then ARGS+=(--owner "${OWNER}"); fi
        if [ -n "${REPO}" ]; then ARGS+=(--repo "${REPO}"); fi
        JSON="$(${{ inputs.vmz-command }} "${ARGS[@]}")"
        echo "${JSON}"
        printf '%s' "${JSON}" | node -e '
        const fs = require("fs");
        const text = fs.readFileSync(0, "utf8");
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start < 0 || end < start) {
          console.error("vmz-tools: missing JSON from vmz github-actions");
          process.exit(1);
        }
        const j = JSON.parse(text.slice(start, end + 1));
        const out = process.env.GITHUB_OUTPUT;
        const w = (k, v) => fs.appendFileSync(out, `${k}=${v ?? ""}\n`);
        w("run-id", j.runId);
        w("status", j.status);
        w("conclusion", j.conclusion);
        w("html-url", j.htmlUrl);
        '
