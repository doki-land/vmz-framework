name: VMZ Tools
description: >-
  Official tool collection for VMZ CI hosts. First tool monitors GitHub Actions
  via the GitHub API (Octokit / @actions/github). Does not require the gh CLI.
  Downstream: doki-land/vmz-framework/.github/actions/vmz-tools@<ref>

inputs:
  tool:
    description: Tool id in this collection (github-actions)
    required: false
    default: github-actions
  mode:
    description: github-actions mode — status (one-shot) or wait (poll until completed)
    required: false
    default: status
  workflow:
    description: Workflow file name (e.g. ci.yml) or numeric workflow id
    required: false
    default: ''
  run-id:
    description: Watch a specific workflow run id (skips workflow/ref lookup)
    required: false
    default: ''
  ref:
    description: Commit SHA (head_sha filter when listing runs)
    required: false
    default: ''
  branch:
    description: Branch name filter when listing runs
    required: false
    default: ''
  timeout-minutes:
    description: Max wait time for mode=wait
    required: false
    default: '45'
  interval-seconds:
    description: Poll interval for mode=wait
    required: false
    default: '15'
  required-conclusion:
    description: Required conclusion when mode=wait (default success)
    required: false
    default: success
  token:
    description: GitHub token for Actions API (defaults to env GITHUB_TOKEN)
    required: false
    default: ${{ github.token }}
  owner:
    description: Repository owner override (default github.repository_owner)
    required: false
    default: ''
  repo:
    description: Repository name override (default github.event.repository.name)
    required: false
    default: ''

outputs:
  run-id:
    description: Resolved workflow run id
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: Latest run status
    value: ${{ steps.run.outputs.status }}
  conclusion:
    description: Latest run conclusion (empty while in progress)
    value: ${{ steps.run.outputs.conclusion }}
  html-url:
    description: Workflow run HTML URL
    value: ${{ steps.run.outputs.html-url }}

runs:
  using: composite
  steps:
    - name: Install API libraries
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev

    - name: Run tool
      id: run
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_TOOL: ${{ inputs.tool }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_RUN-ID: ${{ inputs.run-id }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TIMEOUT-MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_INTERVAL-SECONDS: ${{ inputs.interval-seconds }}
        INPUT_REQUIRED-CONCLUSION: ${{ inputs.required-conclusion }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPO: ${{ inputs.repo }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node src/index.js
