[workspace]
resolver = "2"
members = [
    "packages/compilers/vmz-protocol",
    "packages/compilers/vmz-types",
    "packages/compilers/vmz-generator",
    "packages/compilers/vmz-compiler",
    "packages/compilers/vmz-debugger",
    "packages/compilers/vmz-inspector",
    "packages/compilers/vmz-formatter",
    "packages/compilers/vmz-oak-frontend-adapter",
    "packages/compilers/vmz-napi",
    "packages/compilers/vmz-artifacts",
    "packages/compilers/vmz-github",
    "packages/compilers/vmz-plugin-tailwind",
    "packages/compilers/vmz-plugin-sasso",
]
default-members = ["packages/compilers/vmz-compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["VMZ Contributors"]
repository = "https://github.com/vmz-framework/vmz-framework"
rust-version = "1.95"
# Oak frontend integration requires nightly (see `rust-toolchain.toml`).

[workspace.dependencies]
vmz-protocol = { path = "packages/compilers/vmz-protocol" }
vmz-types = { path = "packages/compilers/vmz-types" }
vmz-generator = { path = "packages/compilers/vmz-generator" }
vmz-compiler = { path = "packages/compilers/vmz-compiler" }
vmz-artifacts = { path = "packages/compilers/vmz-artifacts" }
vmz-github = { path = "packages/compilers/vmz-github" }
vmz-debugger = { path = "packages/compilers/vmz-debugger" }
vmz-inspector = { path = "packages/compilers/vmz-inspector" }
vmz-formatter = { path = "packages/compilers/vmz-formatter" }
vmz-plugin-tailwind = { path = "packages/compilers/vmz-plugin-tailwind" }
vmz-plugin-sasso = { path = "packages/compilers/vmz-plugin-sasso" }
vmz-oak-frontend-adapter = { path = "packages/compilers/vmz-oak-frontend-adapter" }

oak-core = { path = "../oaks/projects/oak-core" }
oak-vue = { path = "../oaks/examples/oak-vue" }
oak-typescript = { path = "../oaks/examples/oak-typescript" }
editorconfig = "1.0.0"

clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2.2", features = ["derive"] }

json5 = "1.3.1"
# Maintained serde_yaml fork (YAML Organization).
yaml_serde = "0.10.6"
sha2 = "0.11.0"
thiserror = "2.0.20"
boost-fs = { path = "../rust-boost/projects/boost-fs" }
boost-http = { path = "../rust-boost/projects/boost-http" }
tokio = { version = "1", features = ["rt", "time", "macros"] }

napi = { version = "3.12.1", default-features = true, features = ["napi4"] }
napi-derive = "3.6.3"
sasso = "0.8.1"
tailwind = { git = "https://github.com/oovm/tailwind-rs.git", branch = "dev" }
tailwind-css = { git = "https://github.com/oovm/tailwind-rs.git", branch = "dev" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
