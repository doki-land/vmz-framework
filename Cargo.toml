[workspace]
resolver = "2"
members = [
    "packages/compilers/vmz-protocol",
    "packages/compilers/vmz-types",
    "packages/compilers/vmz-generator",
    "packages/compilers/vmz-compiler",
    "packages/compilers/vmz-debugger",
    "packages/compilers/vmz-inspector",
    "packages/compilers/vmz-formatter",
    "packages/compilers/vmz-napi",
    "packages/compilers/vmz-artifacts",
    "packages/compilers/vmz-github",
    "packages/compilers/vmz-plugin-tailwind",
    "packages/compilers/vmz-plugin-sasso",
]
default-members = ["packages/compilers/vmz-compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["VMZ Contributors"]
repository = "https://github.com/vmz-framework/vmz-framework"
rust-version = "1.95"

[workspace.dependencies]
vmz-protocol = { path = "packages/compilers/vmz-protocol" }
vmz-types = { path = "packages/compilers/vmz-types" }
vmz-generator = { path = "packages/compilers/vmz-generator" }
vmz-compiler = { path = "packages/compilers/vmz-compiler" }
vmz-artifacts = { path = "packages/compilers/vmz-artifacts" }
vmz-github = { path = "packages/compilers/vmz-github" }
vmz-debugger = { path = "packages/compilers/vmz-debugger" }
vmz-inspector = { path = "packages/compilers/vmz-inspector" }
vmz-formatter = { path = "packages/compilers/vmz-formatter" }
vmz-plugin-tailwind = { path = "packages/compilers/vmz-plugin-tailwind" }
vmz-plugin-sasso = { path = "packages/compilers/vmz-plugin-sasso" }

# All oxc_* locked to one git tag (includes publish=false formatter crates).
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_ast = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0", features = ["sourcemap"] }
oxc_minifier = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_sourcemap = "8.1.2"
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_str = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_transformer = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc_formatter_css = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }
oxc-css-parser = "0.0.11"
editorconfig = "1.0.0"

clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2.2", features = ["derive"] }

json5 = "1.3.1"
# Maintained serde_yaml fork (YAML Organization).
yaml_serde = "0.10.6"
sha2 = "0.11.0"
thiserror = "2.0.20"
walkdir = "2.5.0"
octocrab = "0.44"
tokio = { version = "1", features = ["rt", "time", "macros"] }

napi = { version = "3.12.1", default-features = true, features = ["napi4"] }
napi-derive = "3.6.3"
sasso = "0.8.1"
tailwind = { git = "https://github.com/oovm/tailwind-rs.git", branch = "dev" }
tailwind-css = { git = "https://github.com/oovm/tailwind-rs.git", branch = "dev" }

[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.144.0" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
