# Copy to `config.toml` (git ignored) and replace `<your-path>` with your local absolute path.
# CI / publish: no `config.toml` — the root `Cargo.toml` pinned revision only.
# Verify: `cargo tree -p data-text-core` → filesystem path = patch active.
# Warning: an active patch rewrites the tracked `Cargo.lock` against the sibling
# tree and drops the Boost git `source` pins, so local builds stop matching CI.
# Restore the tracked lock before staging, or verify in a clean checkout.

[patch."https://github.com/oovm/rust-boost"]
data-text-core = { path = "<your-path>/rust-boost/projects/data/data.text.core" }
data-text-vue = { path = "<your-path>/rust-boost/projects/data/data.text.vue" }
data-text-typescript = { path = "<your-path>/rust-boost/projects/data/data.text.typescript" }
